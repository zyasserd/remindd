notificationWindow:
  start: "00:00"
  end: "00:00"  # start==end => allow all day (per SPEC.md)

reminders:
  demoInterval:
    type: interval
    label: "Demo interval reminder"
    snooze: 7200
    interval:
      duration: 86400
      # interval.lastDoneCommand is optional; if omitted, remindd uses state.lastDone (missing/null => 0).
      lastDoneCommand: "echo 0"
    action:
      label: "Mark done"
      command: "echo demoInterval done"

  demoCondition:
    type: condition
    label: "Demo condition reminder"
    snooze: 1800
    condition:
      interval: 60
      command: "true"   # exit 0 => true
      trigger: 1
    action:
      label: "Reset"
      command: "echo demoCondition reset"
