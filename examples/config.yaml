notificationWindow:
  start: "00:00"
  end: "00:00"  # start==end => allow all day (per SPEC.md)

reminders:
  demoInterval:
    type: interval
    label: "Demo interval reminder"
    interval: 1d
    # lastDone.command is optional; if omitted, remindd uses state.lastDone (missing/null => 0).
    lastDone:
      command: "echo 0"
    action:
      label: "Mark done"
      command: "echo demoInterval done"
    snooze:
      default: 2h

  demoCondition:
    type: condition
    label: "Demo condition reminder"
    check:
      interval: 1m
      command: "true"   # exit 0 => true
    trigger:
      consecutive: 1
    action:
      label: "Reset"
      command: "echo demoCondition reset"
    snooze:
      default: 30m
