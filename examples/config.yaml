notifyWindow:
  from: "00:00"
  to: "00:00"  # from==to => allow all day (per SPEC.md)

reminders:
  demoInterval:
    type: interval
    label: "Demo interval reminder"
    snooze: 7200
    every: 86400
    # lastDoneOverride is optional; if omitted, remindd uses state.lastDone (missing/null => 0).
    lastDoneOverride: "echo 0"
    action:
      label: "Mark done"
      command: "echo demoInterval done"

  osUpdate:
    type: interval
    label: "Update NixOS"
    every: 1814400
    action:
      label: "Open /etc/nixos"
      command: "code /etc/nixos"

  demoCondition:
    type: condition
    label: "Demo condition reminder"
    snooze: 1800
    every: 60
    conditionCommand: "true"   # exit 0 => true
    trigger: 1
    action:
      label: "Reset"
      command: "echo demoCondition reset"
